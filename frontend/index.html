<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="OptimoLMS — campuses, users and role permissions for the learning management platform."
    />
    <title>OptimoLMS</title>
    <!-- Resolve the theme before first paint so there is no flash of the wrong one. -->
    <script>
      (() => {
        var STORAGE_KEY = "optimolms.theme.v1";
        var preference = "system";
        try {
          const stored = window.localStorage.getItem(STORAGE_KEY);
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch (error) {
          preference = "system";
        }
        var theme = preference;
        if (preference === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          // Keep "system" stored so the app keeps following the OS setting
          // until the user picks an explicit theme.
          try {
            window.localStorage.setItem(STORAGE_KEY, "system");
          } catch (error) {
            /* persistence is optional */
          }
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-theme-preference", preference);
        root.style.colorScheme = theme;
        try {
          const font = window.localStorage.getItem("optimolms.font.v1");
          if (font === "legible" || font === "dyslexic") root.setAttribute("data-font", font);
          // Accent ids mirror ACCENTS in scripts/accents.mjs; CSS falls back
          // to blue for anything unknown.
          const accent = window.localStorage.getItem("optimolms.accent.v1");
          if (accent && /^[a-z]+$/.test(accent)) root.setAttribute("data-accent", accent);
          const contrast = window.localStorage.getItem("optimolms.contrast.v1");
          const more = window.matchMedia("(prefers-contrast: more)").matches;
          root.setAttribute("data-contrast", contrast === "high" || more ? "high" : "standard");
        } catch (error) {
          /* persistence is optional */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
